<!--
  ============================================================================
  AVATAR PROFILE MENU — new reusable component
  ============================================================================
  WHERE THIS GOES:
    Paste this block INSIDE your existing <div class="nav-actions"> ...
    </div>, in place of your current .theme-toggle button AND your
    #authButton login link. Nothing else in your navbar changes.

  WHAT IT NEEDS:
    <link rel="stylesheet" href="{{ url_for('static', filename='avatar-profile.css') }}">
    <script src="{{ url_for('static', filename='avatar-profile.js') }}" defer></script>

  It does not read or write any of your existing IDs/classes. It is fully
  self-contained under the "apm-" namespace. See README.md for the JS API
  used to wire it up to Firebase auth later (setUser / setGuest / events).
  ============================================================================
-->
<div class="apm-root" id="apmRoot" data-state="guest">

  <!-- Trigger button: replaces theme-toggle + login button -->
  <button
    class="apm-trigger"
    id="apmTrigger"
    type="button"
    aria-haspopup="menu"
    aria-expanded="false"
    aria-controls="apmPanel"
    aria-label="Open account menu">
    <span class="apm-avatar" id="apmAvatarSlot" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" class="apm-guest-icon">
        <circle cx="12" cy="8" r="3.6" stroke="currentColor" stroke-width="1.6"/>
        <path d="M4.5 19.2c1.4-3.4 4.4-5.2 7.5-5.2s6.1 1.8 7.5 5.2" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
      </svg>
    </span>
    <span class="apm-status-dot" id="apmStatusDot" aria-hidden="true"></span>
  </button>

  <!-- Mobile scrim behind the panel -->
  <div class="apm-scrim" id="apmScrim" hidden></div>

  <!-- Dropdown / bottom-sheet panel -->
  <div class="apm-panel" id="apmPanel" role="menu" aria-hidden="true" aria-label="Account menu">
    <div class="apm-panel-inner" id="apmPanelInner">

      <!-- ============ MAIN VIEW ============ -->
      <div class="apm-view apm-view-main is-active" data-view="main">

        <div class="apm-header">
          <span class="apm-header-avatar" id="apmHeaderAvatar" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" class="apm-guest-icon">
              <circle cx="12" cy="8" r="3.6" stroke="currentColor" stroke-width="1.6"/>
              <path d="M4.5 19.2c1.4-3.4 4.4-5.2 7.5-5.2s6.1 1.8 7.5 5.2" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
            </svg>
          </span>
          <span class="apm-header-text">
            <strong class="apm-header-name" id="apmHeaderName">Guest User</strong>
            <span class="apm-header-email" id="apmHeaderEmail" hidden></span>
          </span>
          <span class="apm-plan-badge" id="apmPlanBadge">Free Plan</span>
        </div>

        <div class="apm-divider"></div>

        <div class="apm-menu">
          <button class="apm-item" type="button" data-submenu="appearance">
            <span class="apm-item-icon" aria-hidden="true">🎨</span>
            <span class="apm-item-label">Appearance</span>
            <span class="apm-item-chevron" aria-hidden="true">›</span>
          </button>
          <button class="apm-item" type="button" data-submenu="language">
            <span class="apm-item-icon" aria-hidden="true">🌐</span>
            <span class="apm-item-label">Language</span>
            <span class="apm-item-chevron" aria-hidden="true">›</span>
          </button>
          <button class="apm-item" type="button" data-submenu="notifications">
            <span class="apm-item-icon" aria-hidden="true">🔔</span>
            <span class="apm-item-label">Notifications</span>
            <span class="apm-item-chevron" aria-hidden="true">›</span>
          </button>
          <button class="apm-item" type="button" data-action="saved-reports">
            <span class="apm-item-icon" aria-hidden="true">📄</span>
            <span class="apm-item-label">Saved Reports</span>
          </button>
          <button class="apm-item apm-item-premium" type="button" data-action="go-premium">
            <span class="apm-item-icon" aria-hidden="true">💎</span>
            <span class="apm-item-label">Go Premium</span>
          </button>
          <button class="apm-item" type="button" data-action="feedback">
            <span class="apm-item-icon" aria-hidden="true">💬</span>
            <span class="apm-item-label">Feedback</span>
          </button>
          <button class="apm-item" type="button" data-action="about">
            <span class="apm-item-icon" aria-hidden="true">ℹ️</span>
            <span class="apm-item-label">About Project</span>
          </button>
        </div>

        <div class="apm-divider"></div>

        <div class="apm-footer">
          <a class="apm-auth-btn apm-login-btn" id="apmLoginBtn" href="/login">
            <span class="apm-item-icon" aria-hidden="true">🔑</span> Login
          </a>
          <button class="apm-auth-btn apm-logout-btn" id="apmLogoutBtn" type="button" hidden>
            <span class="apm-item-icon" aria-hidden="true">🚪</span> Logout
          </button>
        </div>
      </div>

      <!-- ============ APPEARANCE SUBMENU ============ -->
      <div class="apm-view apm-view-sub" data-view="appearance">
        <div class="apm-subheader">
          <button class="apm-back-btn" type="button" data-back aria-label="Back to menu">‹</button>
          <span>Appearance</span>
        </div>
        <div class="apm-menu">
          <button class="apm-item apm-option" type="button" data-theme-option="light">
            <span class="apm-item-icon" aria-hidden="true">☀️</span>
            <span class="apm-item-label">Light</span>
            <span class="apm-check" aria-hidden="true">✓</span>
          </button>
          <button class="apm-item apm-option" type="button" data-theme-option="dark">
            <span class="apm-item-icon" aria-hidden="true">🌙</span>
            <span class="apm-item-label">Dark</span>
            <span class="apm-check" aria-hidden="true">✓</span>
          </button>
          <button class="apm-item apm-option" type="button" data-theme-option="system">
            <span class="apm-item-icon" aria-hidden="true">🖥️</span>
            <span class="apm-item-label">System</span>
            <span class="apm-check" aria-hidden="true">✓</span>
          </button>
        </div>
      </div>

      <!-- ============ LANGUAGE SUBMENU ============ -->
      <div class="apm-view apm-view-sub" data-view="language">
        <div class="apm-subheader">
          <button class="apm-back-btn" type="button" data-back aria-label="Back to menu">‹</button>
          <span>Language</span>
        </div>
        <div class="apm-menu">
          <button class="apm-item apm-option" type="button" data-lang-option="en">
            <span class="apm-item-icon" aria-hidden="true">🇬🇧</span>
            <span class="apm-item-label">English</span>
            <span class="apm-check" aria-hidden="true">✓</span>
          </button>
          <button class="apm-item apm-option" type="button" data-lang-option="hi">
            <span class="apm-item-icon" aria-hidden="true">🇮🇳</span>
            <span class="apm-item-label">Hindi</span>
            <span class="apm-check" aria-hidden="true">✓</span>
          </button>
        </div>
      </div>

      <!-- ============ NOTIFICATIONS SUBMENU ============ -->
      <div class="apm-view apm-view-sub" data-view="notifications">
        <div class="apm-subheader">
          <button class="apm-back-btn" type="button" data-back aria-label="Back to menu">‹</button>
          <span>Notifications</span>
        </div>
        <div class="apm-menu">
          <div class="apm-item apm-switch-row">
            <span class="apm-item-icon" aria-hidden="true">🔔</span>
            <span class="apm-item-label">Enable Notifications</span>
            <button class="apm-switch" type="button" role="switch" aria-checked="true" data-toggle="enable-notifications"></button>
          </div>
          <div class="apm-item apm-switch-row">
            <span class="apm-item-icon" aria-hidden="true">📰</span>
            <span class="apm-item-label">Weekly Career Updates</span>
            <button class="apm-switch" type="button" role="switch" aria-checked="true" data-toggle="weekly-updates"></button>
          </div>
          <div class="apm-item apm-switch-row">
            <span class="apm-item-icon" aria-hidden="true">🎯</span>
            <span class="apm-item-label">Placement Alerts</span>
            <button class="apm-switch" type="button" role="switch" aria-checked="false" data-toggle="placement-alerts"></button>
          </div>
        </div>
      </div>

    </div>
  </div>
</div>

<!--
  ============================================================================
  FEEDBACK MODAL — sibling of apm-root, place it right after the closing
  </div> of apm-root (anywhere in the document body works; it's fixed/overlay
  positioned and only becomes visible when triggered).
  ============================================================================
-->
<div class="apm-modal-overlay" id="apmFeedbackOverlay" hidden>
  <div class="apm-modal" role="dialog" aria-modal="true" aria-labelledby="apmFeedbackTitle">
    <div class="apm-modal-header">
      <h3 id="apmFeedbackTitle">Send feedback</h3>
      <button class="apm-modal-close" id="apmFeedbackClose" type="button" aria-label="Close feedback dialog">×</button>
    </div>
    <div class="apm-modal-body">
      <label class="apm-modal-label" for="apmFeedbackText">What's on your mind?</label>
      <textarea
        id="apmFeedbackText"
        class="apm-modal-textarea"
        rows="4"
        maxlength="500"
        placeholder="Tell us what's working, what's not, or what you'd like to see..."></textarea>
      <div class="apm-modal-charcount"><span id="apmFeedbackCount">0</span>/500</div>
    </div>
    <div class="apm-modal-footer">
      <button class="apm-btn-ghost" id="apmFeedbackCancel" type="button">Cancel</button>
      <button class="apm-btn-primary" id="apmFeedbackSubmit" type="button">Send feedback</button>
    </div>
  </div>
</div>
